AWSTemplateFormatVersion: "2010-09-09"
Description: Claudiu GitHub Actions OIDC Role - Backend

Resources:
        GitHubActionsBackendRole:
                Type: AWS::IAM::Role
                Properties:
                        RoleName: claudiu-github-actions-backend
                        AssumeRolePolicyDocument:
                                Version: "2012-10-17"
                                Statement:
                                        - Effect: Allow
                                          Principal:
                                                  Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
                                          Action: sts:AssumeRoleWithWebIdentity
                                          Condition:
                                                  StringEquals:
                                                          token.actions.githubusercontent.com:aud: sts.amazonaws.com
                                                          token.actions.githubusercontent.com:sub: repo:ClaudiuAWS/claudiu:ref:refs/heads/main

        GitHubActionsBackendPolicy:
                Type: AWS::IAM::ManagedPolicy
                Properties:
                        ManagedPolicyName: claudiu-github-actions-backend-policy
                        Roles:
                                - !Ref GitHubActionsBackendRole
                        PolicyDocument:
                                Version: "2012-10-17"
                                Statement:
                                        - Sid: LambdaDeploy
                                          Effect: Allow
                                          Action:
                                                  - lambda:UpdateFunctionCode
                                                  - lambda:UpdateFunctionConfiguration
                                                  - lambda:GetFunction
                                                  - lambda:GetFunctionConfiguration
                                                  - lambda:CreateFunction
                                                  - lambda:DeleteFunction
                                                  - lambda:TagResource
                                                  - lambda:UntagResource
                                                  - lambda:ListTags
                                          Resource:
                                                  - !Sub arn:aws:lambda:eu-central-1:${AWS::AccountId}:function:claudiu-*

                                        # CloudFormation deploys. The api-gateway-claudiu stack
                                        # is the original; everything else lives under the
                                        # `claudiu-*` / `*-claudiu` naming convention so the
                                        # wildcards stay tight.
                                        - Sid: CloudFormationDeploy
                                          Effect: Allow
                                          Action:
                                                  - cloudformation:CreateStack
                                                  - cloudformation:UpdateStack
                                                  - cloudformation:DeleteStack
                                                  - cloudformation:CreateChangeSet
                                                  - cloudformation:DescribeChangeSet
                                                  - cloudformation:ExecuteChangeSet
                                                  - cloudformation:DeleteChangeSet
                                                  - cloudformation:DescribeStacks
                                                  - cloudformation:DescribeStackEvents
                                                  - cloudformation:DescribeStackResource
                                                  - cloudformation:DescribeStackResources
                                                  - cloudformation:GetTemplate
                                                  - cloudformation:GetTemplateSummary
                                                  - cloudformation:ListStackResources
                                                  - cloudformation:ListStacks
                                                  - cloudformation:ValidateTemplate
                                          Resource:
                                                  - !Sub arn:aws:cloudformation:eu-central-1:${AWS::AccountId}:stack/api-gateway-claudiu/*
                                                  - !Sub arn:aws:cloudformation:eu-central-1:${AWS::AccountId}:stack/claudiu-*/*

                                        # DynamoDB table management for new service stacks
                                        # (claudiu-credits, future claudiu-inventory, etc.).
                                        # Scoped to claudiu-* tables only.
                                        - Sid: DynamoDBManage
                                          Effect: Allow
                                          Action:
                                                  - dynamodb:CreateTable
                                                  - dynamodb:UpdateTable
                                                  - dynamodb:DeleteTable
                                                  - dynamodb:DescribeTable
                                                  - dynamodb:DescribeTimeToLive
                                                  - dynamodb:UpdateTimeToLive
                                                  - dynamodb:DescribeContinuousBackups
                                                  - dynamodb:TagResource
                                                  - dynamodb:UntagResource
                                                  - dynamodb:ListTagsOfResource
                                          Resource:
                                                  - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-*

                                        # IAM management for the per-Lambda execution roles
                                        # defined inside the *-lambda.yml CFN templates. Scope
                                        # is narrow — only claudiu-* role names.
                                        - Sid: IAMRoleManage
                                          Effect: Allow
                                          Action:
                                                  - iam:CreateRole
                                                  - iam:DeleteRole
                                                  - iam:GetRole
                                                  - iam:UpdateRole
                                                  - iam:UpdateAssumeRolePolicy
                                                  - iam:AttachRolePolicy
                                                  - iam:DetachRolePolicy
                                                  - iam:PutRolePolicy
                                                  - iam:DeleteRolePolicy
                                                  - iam:GetRolePolicy
                                                  - iam:ListRolePolicies
                                                  - iam:ListAttachedRolePolicies
                                                  - iam:PassRole
                                                  - iam:TagRole
                                                  - iam:UntagRole
                                          Resource:
                                                  - !Sub arn:aws:iam::${AWS::AccountId}:role/claudiu-*

                                        # API Gateway resources are managed by the
                                        # api-gateway-claudiu stack. Wildcard scope is
                                        # required because the API ID is allocated by
                                        # CFN itself; the stack scope above bounds the
                                        # actual changes.
                                        - Sid: ApiGatewayManage
                                          Effect: Allow
                                          Action:
                                                  - apigateway:GET
                                                  - apigateway:POST
                                                  - apigateway:PUT
                                                  - apigateway:PATCH
                                                  - apigateway:DELETE
                                                  - apigateway:TagResource
                                                  - apigateway:UntagResource
                                          Resource:
                                                  - !Sub arn:aws:apigateway:eu-central-1::/*

                                        # api-gateway.yml defines AWS::Lambda::Permission
                                        # resources binding API Gateway to the rooms /
                                        # matches / replay-emitter Lambdas. CFN needs
                                        # to add/remove these as routes change.
                                        - Sid: CfnTemplateUpload
                                          Effect: Allow
                                          Action:
                                                  - s3:PutObject
                                                  - s3:GetObject
                                          Resource:
                                                  - !Sub arn:aws:s3:::claudiu-profile-pictures-${AWS::AccountId}/cfn-templates/*

                                        - Sid: LambdaInvokePermissions
                                          Effect: Allow
                                          Action:
                                                  - lambda:AddPermission
                                                  - lambda:RemovePermission
                                                  - lambda:GetPolicy
                                          Resource:
                                                  - !Sub arn:aws:lambda:eu-central-1:${AWS::AccountId}:function:claudiu-*

Outputs:
        RoleArn:
                Value: !GetAtt GitHubActionsBackendRole.Arn
                Export:
                        Name: claudiu-github-actions-backend-role-arn
