AWSTemplateFormatVersion: "2010-09-09"
Description: Claudiu Cognito Auth

Resources:
        UserPool:
                Type: AWS::Cognito::UserPool
                Properties:
                        UserPoolName: claudiu-user-pool
                        AutoVerifiedAttributes:
                                - email
                        UsernameAttributes:
                                - email
                        EmailConfiguration:
                                EmailSendingAccount: DEVELOPER
                                From: mihaiciorascu11@gmail.com
                                SourceArn: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/mihaiciorascu11@gmail.com
                        VerificationMessageTemplate:
                                DefaultEmailOption: CONFIRM_WITH_CODE
                                EmailSubject: "Your Bundesliga Fantasy verification code"
                                EmailMessage: |
                                        Welcome to Bundesliga Fantasy! Your verification code is {####}.

                                        If you didn't sign up, you can safely ignore this email.
                        Policies:
                                PasswordPolicy:
                                        MinimumLength: 8
                                        RequireUppercase: false
                                        RequireLowercase: false
                                        RequireNumbers: false
                                        RequireSymbols: false
                        Schema:
                                - Name: name
                                  AttributeDataType: String
                                  Required: true
                                  Mutable: true
                                - Name: avatar_url
                                  AttributeDataType: String
                                  Required: false
                                  Mutable: true

        UserPoolClient:
                Type: AWS::Cognito::UserPoolClient
                Properties:
                        ClientName: claudiu-web-client
                        UserPoolId: !Ref UserPool
                        GenerateSecret: false
                        ExplicitAuthFlows:
                                - ALLOW_USER_SRP_AUTH
                                - ALLOW_REFRESH_TOKEN_AUTH
                        ReadAttributes:
                                - email
                                - name
                                - custom:avatar_url
                        WriteAttributes:
                                - email
                                - name
                                - custom:avatar_url
                        AccessTokenValidity: 1
                        IdTokenValidity: 1
                        RefreshTokenValidity: 30
                        TokenValidityUnits:
                                AccessToken: hours
                                IdToken: hours
                                RefreshToken: days

Outputs:
        UserPoolId:
                Value: !Ref UserPool
                Export:
                        Name: claudiu-user-pool-id

        UserPoolClientId:
                Value: !Ref UserPoolClient
                Export:
                        Name: claudiu-user-pool-client-id
