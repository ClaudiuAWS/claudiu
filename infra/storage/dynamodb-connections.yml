AWSTemplateFormatVersion: "2010-09-09"
Description: Claudiu DynamoDB Table - WebSocket Connections

Resources:
        ConnectionsTable:
                Type: AWS::DynamoDB::Table
                Properties:
                        TableName: claudiu-ws-connections
                        BillingMode: PAY_PER_REQUEST
                        AttributeDefinitions:
                                - AttributeName: connectionId
                                  AttributeType: S
                                - AttributeName: channel
                                  AttributeType: S
                        KeySchema:
                                - AttributeName: connectionId
                                  KeyType: HASH
                        GlobalSecondaryIndexes:
                                - IndexName: channel-index
                                  KeySchema:
                                          - AttributeName: channel
                                            KeyType: HASH
                                  Projection:
                                          ProjectionType: KEYS_ONLY
                        TimeToLiveSpecification:
                                AttributeName: ttl
                                Enabled: true

Outputs:
        ConnectionsTableName:
                Value: !Ref ConnectionsTable
                Export:
                        Name: claudiu-ws-connections-table

        ConnectionsTableArn:
                Value: !GetAtt ConnectionsTable.Arn
                Export:
                        Name: claudiu-ws-connections-table-arn
