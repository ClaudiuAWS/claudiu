AWSTemplateFormatVersion: "2010-09-09"
Description: Claudiu Lambda Functions - Logger

Resources:
        # ─────────────────────────────────────────
        # CloudWatch Log Group
        # ─────────────────────────────────────────

        FrontendLogGroup:
                Type: AWS::Logs::LogGroup
                Properties:
                        LogGroupName: /frontend/claudiu
                        RetentionInDays: 1

        # ─────────────────────────────────────────
        # IAM Role
        # ─────────────────────────────────────────

        LoggerLambdaRole:
                Type: AWS::IAM::Role
                Properties:
                        RoleName: claudiu-logger-lambda-role
                        AssumeRolePolicyDocument:
                                Version: "2012-10-17"
                                Statement:
                                        - Effect: Allow
                                          Principal:
                                                  Service: lambda.amazonaws.com
                                          Action: sts:AssumeRole
                        ManagedPolicyArns:
                                - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
                        Policies:
                                - PolicyName: claudiu-logger-lambda-policy
                                  PolicyDocument:
                                          Version: "2012-10-17"
                                          Statement:
                                                  - Sid: CloudWatchLogsAccess
                                                    Effect: Allow
                                                    Action:
                                                            - logs:CreateLogStream
                                                            - logs:PutLogEvents
                                                    Resource: !Sub arn:aws:logs:eu-central-1:${AWS::AccountId}:log-group:/frontend/claudiu:*

        # ─────────────────────────────────────────
        # Logger Lambda
        # ─────────────────────────────────────────

        LoggerLambda:
                Type: AWS::Lambda::Function
                Properties:
                        FunctionName: claudiu-logger
                        Runtime: python3.14
                        Handler: handler.handler
                        Role: !GetAtt LoggerLambdaRole.Arn
                        Timeout: 10
                        MemorySize: 128
                        Environment:
                                Variables:
                                        LOG_GROUP: /frontend/claudiu
                        Code:
                                ZipFile: |
                                        def handler(event, context):
                                            return {'statusCode': 200, 'body': 'ok'}

Outputs:
        LoggerLambdaArn:
                Value: !GetAtt LoggerLambda.Arn
                Export:
                        Name: claudiu-logger-lambda-arn
