                        DeploymentId: !Ref RestApiDeployment20260518
                        StageName: prod

        # GatewayResponses inject CORS headers onto API Gateway's DEFAULT
        # 4XX / 5XX responses (the ones returned BEFORE the Lambda runs —
        # e.g. when a Cognito-authorized route gets an expired token, or
        # an unpublished route gets called). Without these, the browser
        # receives a response with no Access-Control-Allow-Origin header
        # and reports `TypeError: Failed to fetch` — masking what's
        # actually a 401 or 403. Adding CORS lets the FE surface a real
        # message (e.g. "Session expired, please sign in").
        GatewayResponseDefault4XX:
                Type: AWS::ApiGateway::GatewayResponse
                Properties:
                        RestApiId: !Ref RestApi
                        ResponseType: DEFAULT_4XX
                        ResponseParameters:
                                gatewayresponse.header.Access-Control-Allow-Origin:  "'*'"
                                gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
                                gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,PATCH,OPTIONS'"

        GatewayResponseDefault5XX:
                Type: AWS::ApiGateway::GatewayResponse
                Properties:
                        RestApiId: !Ref RestApi
                        ResponseType: DEFAULT_5XX
                        ResponseParameters:
                                gatewayresponse.header.Access-Control-Allow-Origin:  "'*'"
                                gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
                                gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,PATCH,OPTIONS'"

