        # -----------------------------------------

        # AWS::ApiGateway::Deployment will NOT be recreated by CFN when
        # only DependsOn / Description change. To publish new Methods to
        # the prod stage, rename this LogicalId on each significant route
        # addition. Old Deployment is removed after Stage swaps to the new
        # one — no downtime. Next route add → bump the date suffix.
