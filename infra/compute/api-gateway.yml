AWSTemplateFormatVersion: "2010-09-09"
Description: Claudiu API Gateway - REST

Resources:
        # ─────────────────────────────────────────
        # REST API
        # ─────────────────────────────────────────

        RestApi:
                Type: AWS::ApiGateway::RestApi
                Properties:
                        Name: claudiu-rest-api
                        Description: Fan Squad REST API
                        EndpointConfiguration:
                                Types:
                                        - REGIONAL

        CognitoAuthorizer:
                Type: AWS::ApiGateway::Authorizer
                Properties:
                        Name: claudiu-cognito-authorizer
                        Type: COGNITO_USER_POOLS
                        IdentitySource: method.request.header.Authorization
                        RestApiId: !Ref RestApi
                        ProviderARNs:
                                - !Sub arn:aws:cognito-idp:eu-central-1:${AWS::AccountId}:userpool/eu-central-1_xMo5k0VLO
                        AuthorizerResultTtlInSeconds: 0

        # ─────────────────────────────────────────
        # /logs
        # ─────────────────────────────────────────

        LogsResource:
                Type: AWS::ApiGateway::Resource
                Properties:
                        RestApiId: !Ref RestApi
                        ParentId: !GetAtt RestApi.RootResourceId
                        PathPart: logs

        PostLogsMethod:
                Type: AWS::ApiGateway::Method
                Properties:
                        RestApiId: !Ref RestApi
                        ResourceId: !Ref LogsResource
                        HttpMethod: POST
                        AuthorizationType: COGNITO_USER_POOLS
                        AuthorizerId: !Ref CognitoAuthorizer
                        Integration:
                                Type: AWS_PROXY
                                IntegrationHttpMethod: POST
                                Uri: !Sub arn:aws:apigateway:eu-central-1:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-central-1:${AWS::AccountId}:function:claudiu-logger/invocations

        LogsOptionsMethod:
                Type: AWS::ApiGateway::Method
                Properties:
                        RestApiId: !Ref RestApi
                        ResourceId: !Ref LogsResource
                        HttpMethod: OPTIONS
                        AuthorizationType: NONE
                        Integration:
                                Type: MOCK
                                IntegrationResponses:
                                        - StatusCode: 200
                                          ResponseParameters:
                                                  method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
                                                  method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
                                                  method.response.header.Access-Control-Allow-Origin: "'*'"
                                          ResponseTemplates:
                                                  application/json: ""
                                RequestTemplates:
                                        application/json: '{"statusCode": 200}'
                        MethodResponses:
                                - StatusCode: 200
                                  ResponseParameters:
                                          method.response.header.Access-Control-Allow-Headers: true
                                          method.response.header.Access-Control-Allow-Methods: true
                                          method.response.header.Access-Control-Allow-Origin: true

        LoggerLambdaPermission:
                Type: AWS::Lambda::Permission
                Properties:
                        FunctionName: claudiu-logger
                        Action: lambda:InvokeFunction
                        Principal: apigateway.amazonaws.com
                        SourceArn: !Sub arn:aws:execute-api:eu-central-1:${AWS::AccountId}:${RestApi}/*

        # ─────────────────────────────────────────
        # /rooms
        # ─────────────────────────────────────────

        RoomsResource:
                Type: AWS::ApiGateway::Resource
                Properties:
                        RestApiId: !Ref RestApi
                        ParentId: !GetAtt RestApi.RootResourceId
                        PathPart: rooms

        RoomsCodeResource:
                Type: AWS::ApiGateway::Resource
                Properties:
                        RestApiId: !Ref RestApi
                        ParentId: !Ref RoomsResource
                        PathPart: "{code}"

        RoomsJoinResource:
                Type: AWS::ApiGateway::Resource
                Properties:
                        RestApiId: !Ref RestApi
                        ParentId: !Ref RoomsCodeResource
                        PathPart: join

        RoomsLeaveResource:
                Type: AWS::ApiGateway::Resource
                Properties:
                        RestApiId: !Ref RestApi
                        ParentId: !Ref RoomsCodeResource
                        PathPart: leave

        PostRoomsMethod:
                Type: AWS::ApiGateway::Method
                Properties:
                        RestApiId: !Ref RestApi
                        ResourceId: !Ref RoomsResource
                        HttpMethod: POST
                        AuthorizationType: COGNITO_USER_POOLS
                        AuthorizerId: !Ref CognitoAuthorizer
                        Integration:
                                Type: AWS_PROXY
                                IntegrationHttpMethod: POST
                                Uri: !Sub arn:aws:apigateway:eu-central-1:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-central-1:${AWS::AccountId}:function:claudiu-rooms/invocations

        GetRoomsCodeMethod:
                Type: AWS::ApiGateway::Method
                Properties:
                        RestApiId: !Ref RestApi
                        ResourceId: !Ref RoomsCodeResource
                        HttpMethod: GET
                        AuthorizationType: COGNITO_USER_POOLS
                        AuthorizerId: !Ref CognitoAuthorizer
                        Integration:
                                Type: AWS_PROXY
                                IntegrationHttpMethod: POST
                                Uri: !Sub arn:aws:apigateway:eu-central-1:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-central-1:${AWS::AccountId}:function:claudiu-rooms/invocations

        PostRoomsJoinMethod:
                Type: AWS::ApiGateway::Method
                Properties:
                        RestApiId: !Ref RestApi
                        ResourceId: !Ref RoomsJoinResource
                        HttpMethod: POST
                        AuthorizationType: COGNITO_USER_POOLS
                        AuthorizerId: !Ref CognitoAuthorizer
                        Integration:
                                Type: AWS_PROXY
                                IntegrationHttpMethod: POST
                                Uri: !Sub arn:aws:apigateway:eu-central-1:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-central-1:${AWS::AccountId}:function:claudiu-rooms/invocations

        DeleteRoomsLeaveMethod:
                Type: AWS::ApiGateway::Method
                Properties:
                        RestApiId: !Ref RestApi
                        ResourceId: !Ref RoomsLeaveResource
                        HttpMethod: DELETE
                        AuthorizationType: COGNITO_USER_POOLS
                        AuthorizerId: !Ref CognitoAuthorizer
                        Integration:
                                Type: AWS_PROXY
                                IntegrationHttpMethod: POST
                                Uri: !Sub arn:aws:apigateway:eu-central-1:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-central-1:${AWS::AccountId}:function:claudiu-rooms/invocations

        RoomsOptionsMethod:
                Type: AWS::ApiGateway::Method
                Properties:
                        RestApiId: !Ref RestApi
                        ResourceId: !Ref RoomsResource
                        HttpMethod: OPTIONS
                        AuthorizationType: NONE
                        Integration:
                                Type: MOCK
                                IntegrationResponses:
                                        - StatusCode: 200
                                          ResponseParameters:
                                                  method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
                                                  method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
                                                  method.response.header.Access-Control-Allow-Origin: "'*'"
                                          ResponseTemplates:
                                                  application/json: ""
                                RequestTemplates:
                                        application/json: '{"statusCode": 200}'
                        MethodResponses:
                                - StatusCode: 200
                                  ResponseParameters:
                                          method.response.header.Access-Control-Allow-Headers: true
                                          method.response.header.Access-Control-Allow-Methods: true
                                          method.response.header.Access-Control-Allow-Origin: true

        RoomsCodeOptionsMethod:
                Type: AWS::ApiGateway::Method
                Properties:
                        RestApiId: !Ref RestApi
                        ResourceId: !Ref RoomsCodeResource
                        HttpMethod: OPTIONS
                        AuthorizationType: NONE
                        Integration:
                                Type: MOCK
                                IntegrationResponses:
                                        - StatusCode: 200
                                          ResponseParameters:
                                                  method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
                                                  method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
                                                  method.response.header.Access-Control-Allow-Origin: "'*'"
                                          ResponseTemplates:
                                                  application/json: ""
                                RequestTemplates:
                                        application/json: '{"statusCode": 200}'
                        MethodResponses:
                                - StatusCode: 200
                                  ResponseParameters:
                                          method.response.header.Access-Control-Allow-Headers: true
                                          method.response.header.Access-Control-Allow-Methods: true
                                          method.response.header.Access-Control-Allow-Origin: true

        RoomsJoinOptionsMethod:
                Type: AWS::ApiGateway::Method
                Properties:
                        RestApiId: !Ref RestApi
                        ResourceId: !Ref RoomsJoinResource
                        HttpMethod: OPTIONS
                        AuthorizationType: NONE
                        Integration:
                                Type: MOCK
                                IntegrationResponses:
                                        - StatusCode: 200
                                          ResponseParameters:
                                                  method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
                                                  method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
                                                  method.response.header.Access-Control-Allow-Origin: "'*'"
                                          ResponseTemplates:
                                                  application/json: ""
                                RequestTemplates:
                                        application/json: '{"statusCode": 200}'
                        MethodResponses:
                                - StatusCode: 200
                                  ResponseParameters:
                                          method.response.header.Access-Control-Allow-Headers: true
                                          method.response.header.Access-Control-Allow-Methods: true
                                          method.response.header.Access-Control-Allow-Origin: true

        RoomsLeaveOptionsMethod:
                Type: AWS::ApiGateway::Method
                Properties:
                        RestApiId: !Ref RestApi
                        ResourceId: !Ref RoomsLeaveResource
                        HttpMethod: OPTIONS
                        AuthorizationType: NONE
                        Integration:
                                Type: MOCK
                                IntegrationResponses:
                                        - StatusCode: 200
                                          ResponseParameters:
                                                  method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
                                                  method.response.header.Access-Control-Allow-Methods: "'DELETE,OPTIONS'"
                                                  method.response.header.Access-Control-Allow-Origin: "'*'"
                                          ResponseTemplates:
                                                  application/json: ""
                                RequestTemplates:
                                        application/json: '{"statusCode": 200}'
                        MethodResponses:
                                - StatusCode: 200
                                  ResponseParameters:
                                          method.response.header.Access-Control-Allow-Headers: true
                                          method.response.header.Access-Control-Allow-Methods: true
                                          method.response.header.Access-Control-Allow-Origin: true

        RoomsLambdaPermission:
                Type: AWS::Lambda::Permission
                Properties:
                        FunctionName: claudiu-rooms
                        Action: lambda:InvokeFunction
                        Principal: apigateway.amazonaws.com
                        SourceArn: !Sub arn:aws:execute-api:eu-central-1:${AWS::AccountId}:${RestApi}/*

        # ─────────────────────────────────────────
        # Deployment
        # ─────────────────────────────────────────

        RestApiDeployment:
                Type: AWS::ApiGateway::Deployment
                DependsOn:
                        - PostLogsMethod
                        - LogsOptionsMethod
                        - PostRoomsMethod
                        - GetRoomsCodeMethod
                        - PostRoomsJoinMethod
                        - DeleteRoomsLeaveMethod
                        - RoomsOptionsMethod
                        - RoomsCodeOptionsMethod
                        - RoomsJoinOptionsMethod
                        - RoomsLeaveOptionsMethod
                Properties:
                        RestApiId: !Ref RestApi

        RestApiStage:
                Type: AWS::ApiGateway::Stage
                Properties:
                        RestApiId: !Ref RestApi
                        DeploymentId: !Ref RestApiDeployment
                        StageName: prod

Outputs:
        RestApiUrl:
                Value: !Sub https://${RestApi}.execute-api.eu-central-1.amazonaws.com/prod
                Export:
                        Name: claudiu-rest-api-url

        RestApiId:
                Value: !Ref RestApi
                Export:
                        Name: claudiu-rest-api-id
