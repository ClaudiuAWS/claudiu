AWSTemplateFormatVersion: "2010-09-09"
Description: Claudiu API Gateway - REST and WebSocket

Resources:
        # ─────────────────────────────────────────
        # REST API
        # ─────────────────────────────────────────

        RestApi:
                Type: AWS::ApiGateway::RestApi
                Properties:
                        Name: claudiu-rest-api
                        Description: Fan Squad REST API
                        EndpointConfiguration:
                                Types:
                                        - REGIONAL

        CognitoAuthorizer:
                Type: AWS::ApiGateway::Authorizer
                Properties:
                        Name: claudiu-cognito-authorizer
                        Type: COGNITO_USER_POOLS
                        IdentitySource: method.request.header.Authorization
                        RestApiId: !Ref RestApi
                        ProviderARNs:
                                - !Sub arn:aws:cognito-idp:eu-central-1:${AWS::AccountId}:userpool/eu-central-1_xMo5k0VLO

        # /rooms resource
        RoomsResource:
                Type: AWS::ApiGateway::Resource
                Properties:
                        RestApiId: !Ref RestApi
                        ParentId: !GetAtt RestApi.RootResourceId
                        PathPart: rooms

        # /rooms/{code} resource
        RoomsCodeResource:
                Type: AWS::ApiGateway::Resource
                Properties:
                        RestApiId: !Ref RestApi
                        ParentId: !Ref RoomsResource
                        PathPart: "{code}"

        # /rooms/{code}/join resource
        RoomsJoinResource:
                Type: AWS::ApiGateway::Resource
                Properties:
                        RestApiId: !Ref RestApi
                        ParentId: !Ref RoomsCodeResource
                        PathPart: join

        # POST /rooms
        PostRoomsMethod:
                Type: AWS::ApiGateway::Method
                Properties:
                        RestApiId: !Ref RestApi
                        ResourceId: !Ref RoomsResource
                        HttpMethod: POST
                        AuthorizationType: COGNITO_USER_POOLS
                        AuthorizerId: !Ref CognitoAuthorizer
                        Integration:
                                Type: AWS_PROXY
                                IntegrationHttpMethod: POST
                                Uri: !Sub arn:aws:apigateway:eu-central-1:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-central-1:${AWS::AccountId}:function:claudiu-rooms/invocations

        # GET /rooms/{code}
        GetRoomsCodeMethod:
                Type: AWS::ApiGateway::Method
                Properties:
                        RestApiId: !Ref RestApi
                        ResourceId: !Ref RoomsCodeResource
                        HttpMethod: GET
                        AuthorizationType: COGNITO_USER_POOLS
                        AuthorizerId: !Ref CognitoAuthorizer
                        Integration:
                                Type: AWS_PROXY
                                IntegrationHttpMethod: POST
                                Uri: !Sub arn:aws:apigateway:eu-central-1:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-central-1:${AWS::AccountId}:function:claudiu-rooms/invocations

        # POST /rooms/{code}/join
        PostRoomsJoinMethod:
                Type: AWS::ApiGateway::Method
                Properties:
                        RestApiId: !Ref RestApi
                        ResourceId: !Ref RoomsJoinResource
                        HttpMethod: POST
                        AuthorizationType: COGNITO_USER_POOLS
                        AuthorizerId: !Ref CognitoAuthorizer
                        Integration:
                                Type: AWS_PROXY
                                IntegrationHttpMethod: POST
                                Uri: !Sub arn:aws:apigateway:eu-central-1:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-central-1:${AWS::AccountId}:function:claudiu-rooms/invocations

        # CORS for /rooms
        RoomsOptionsMethod:
                Type: AWS::ApiGateway::Method
                Properties:
                        RestApiId: !Ref RestApi
                        ResourceId: !Ref RoomsResource
                        HttpMethod: OPTIONS
                        AuthorizationType: NONE
                        Integration:
                                Type: MOCK
                                IntegrationResponses:
                                        - StatusCode: 200
                                          ResponseParameters:
                                                  method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
                                                  method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
                                                  method.response.header.Access-Control-Allow-Origin: "'*'"
                                          ResponseTemplates:
                                                  application/json: ""
                                RequestTemplates:
                                        application/json: '{"statusCode": 200}'
                        MethodResponses:
                                - StatusCode: 200
                                  ResponseParameters:
                                          method.response.header.Access-Control-Allow-Headers: true
                                          method.response.header.Access-Control-Allow-Methods: true
                                          method.response.header.Access-Control-Allow-Origin: true

        # CORS for /rooms/{code}
        RoomsCodeOptionsMethod:
                Type: AWS::ApiGateway::Method
                Properties:
                        RestApiId: !Ref RestApi
                        ResourceId: !Ref RoomsCodeResource
                        HttpMethod: OPTIONS
                        AuthorizationType: NONE
                        Integration:
                                Type: MOCK
                                IntegrationResponses:
                                        - StatusCode: 200
                                          ResponseParameters:
                                                  method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
                                                  method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
                                                  method.response.header.Access-Control-Allow-Origin: "'*'"
                                          ResponseTemplates:
                                                  application/json: ""
                                RequestTemplates:
                                        application/json: '{"statusCode": 200}'
                        MethodResponses:
                                - StatusCode: 200
                                  ResponseParameters:
                                          method.response.header.Access-Control-Allow-Headers: true
                                          method.response.header.Access-Control-Allow-Methods: true
                                          method.response.header.Access-Control-Allow-Origin: true

        # CORS for /rooms/{code}/join
        RoomsJoinOptionsMethod:
                Type: AWS::ApiGateway::Method
                Properties:
                        RestApiId: !Ref RestApi
                        ResourceId: !Ref RoomsJoinResource
                        HttpMethod: OPTIONS
                        AuthorizationType: NONE
                        Integration:
                                Type: MOCK
                                IntegrationResponses:
                                        - StatusCode: 200
                                          ResponseParameters:
                                                  method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
                                                  method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
                                                  method.response.header.Access-Control-Allow-Origin: "'*'"
                                          ResponseTemplates:
                                                  application/json: ""
                                RequestTemplates:
                                        application/json: '{"statusCode": 200}'
                        MethodResponses:
                                - StatusCode: 200
                                  ResponseParameters:
                                          method.response.header.Access-Control-Allow-Headers: true
                                          method.response.header.Access-Control-Allow-Methods: true
                                          method.response.header.Access-Control-Allow-Origin: true

        RestApiDeployment:
                Type: AWS::ApiGateway::Deployment
                DependsOn:
                        - PostRoomsMethod
                        - GetRoomsCodeMethod
                        - PostRoomsJoinMethod
                        - RoomsOptionsMethod
                        - RoomsCodeOptionsMethod
                        - RoomsJoinOptionsMethod
                Properties:
                        RestApiId: !Ref RestApi

        RestApiStage:
                Type: AWS::ApiGateway::Stage
                Properties:
                        RestApiId: !Ref RestApi
                        DeploymentId: !Ref RestApiDeployment
                        StageName: prod

        # ─────────────────────────────────────────
        # WebSocket API
        # ─────────────────────────────────────────

        WebSocketApi:
                Type: AWS::ApiGatewayV2::Api
                Properties:
                        Name: claudiu-websocket-api
                        ProtocolType: WEBSOCKET
                        RouteSelectionExpression: "$request.body.action"

        WebSocketConnectRoute:
                Type: AWS::ApiGatewayV2::Route
                Properties:
                        ApiId: !Ref WebSocketApi
                        RouteKey: $connect
                        AuthorizationType: NONE
                        Target: !Sub integrations/${WebSocketConnectIntegration}

        WebSocketDisconnectRoute:
                Type: AWS::ApiGatewayV2::Route
                Properties:
                        ApiId: !Ref WebSocketApi
                        RouteKey: $disconnect
                        AuthorizationType: NONE
                        Target: !Sub integrations/${WebSocketDisconnectIntegration}

        WebSocketConnectIntegration:
                Type: AWS::ApiGatewayV2::Integration
                Properties:
                        ApiId: !Ref WebSocketApi
                        IntegrationType: AWS_PROXY
                        IntegrationUri: !Sub arn:aws:apigateway:eu-central-1:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-central-1:${AWS::AccountId}:function:claudiu-ws-connect/invocations

        WebSocketDisconnectIntegration:
                Type: AWS::ApiGatewayV2::Integration
                Properties:
                        ApiId: !Ref WebSocketApi
                        IntegrationType: AWS_PROXY
                        IntegrationUri: !Sub arn:aws:apigateway:eu-central-1:lambda:path/2015-03-31/functions/arn:aws:lambda:eu-central-1:${AWS::AccountId}:function:claudiu-ws-disconnect/invocations

        WebSocketStage:
                Type: AWS::ApiGatewayV2::Stage
                Properties:
                        ApiId: !Ref WebSocketApi
                        StageName: prod
                        AutoDeploy: true

        # ─────────────────────────────────────────
        # Lambda permissions to be invoked by API Gateway
        # ─────────────────────────────────────────

        RoomsLambdaPermission:
                Type: AWS::Lambda::Permission
                Properties:
                        FunctionName: claudiu-rooms
                        Action: lambda:InvokeFunction
                        Principal: apigateway.amazonaws.com
                        SourceArn: !Sub arn:aws:execute-api:eu-central-1:${AWS::AccountId}:${RestApi}/*

        WsConnectLambdaPermission:
                Type: AWS::Lambda::Permission
                Properties:
                        FunctionName: claudiu-ws-connect
                        Action: lambda:InvokeFunction
                        Principal: apigateway.amazonaws.com
                        SourceArn: !Sub arn:aws:execute-api:eu-central-1:${AWS::AccountId}:${WebSocketApi}/*

        WsDisconnectLambdaPermission:
                Type: AWS::Lambda::Permission
                Properties:
                        FunctionName: claudiu-ws-disconnect
                        Action: lambda:InvokeFunction
                        Principal: apigateway.amazonaws.com
                        SourceArn: !Sub arn:aws:execute-api:eu-central-1:${AWS::AccountId}:${WebSocketApi}/*

Outputs:
        RestApiUrl:
                Value: !Sub https://${RestApi}.execute-api.eu-central-1.amazonaws.com/prod
                Export:
                        Name: claudiu-rest-api-url

        RestApiId:
                Value: !Ref RestApi
                Export:
                        Name: claudiu-rest-api-id

        WebSocketUrl:
                Value: !Sub wss://${WebSocketApi}.execute-api.eu-central-1.amazonaws.com/prod
                Export:
                        Name: claudiu-websocket-url

        WebSocketApiId:
                Value: !Ref WebSocketApi
                Export:
                        Name: claudiu-websocket-api-id
