AWSTemplateFormatVersion: "2010-09-09"
Description: Claudiu Lambda Functions - Rooms Feature

Resources:
        # ─────────────────────────────────────────
        # IAM Role shared by all rooms-feature Lambdas
        # ─────────────────────────────────────────

        RoomsLambdaRole:
                Type: AWS::IAM::Role
                Properties:
                        RoleName: claudiu-rooms-lambda-role
                        AssumeRolePolicyDocument:
                                Version: "2012-10-17"
                                Statement:
                                        - Effect: Allow
                                          Principal:
                                                  Service: lambda.amazonaws.com
                                          Action: sts:AssumeRole
                        ManagedPolicyArns:
                                - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
                        Policies:
                                - PolicyName: claudiu-rooms-lambda-policy
                                  PolicyDocument:
                                          Version: "2012-10-17"
                                          Statement:
                                                  - Sid: RoomsTableAccess
                                                    Effect: Allow
                                                    Action:
                                                            - dynamodb:PutItem
                                                            - dynamodb:GetItem
                                                            - dynamodb:UpdateItem
                                                            - dynamodb:DeleteItem
                                                            - dynamodb:Query
                                                    Resource:
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-rooms
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-rooms/index/*
                                                  - Sid: ConnectionsTableAccess
                                                    Effect: Allow
                                                    Action:
                                                            - dynamodb:PutItem
                                                            - dynamodb:GetItem
                                                            - dynamodb:UpdateItem
                                                            - dynamodb:DeleteItem
                                                            - dynamodb:Query
                                                    Resource:
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-connections
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-connections/index/*
                                                  - Sid: WebSocketPostAccess
                                                    Effect: Allow
                                                    Action:
                                                            - execute-api:ManageConnections
                                                    Resource:
                                                            - !Sub arn:aws:execute-api:eu-central-1:${AWS::AccountId}:*/@connections/*

        # ─────────────────────────────────────────
        # Rooms Lambda
        # ─────────────────────────────────────────

        RoomsLambda:
                Type: AWS::Lambda::Function
                Properties:
                        FunctionName: claudiu-rooms
                        Runtime: python3.14
                        Handler: handler.handler
                        Role: !GetAtt RoomsLambdaRole.Arn
                        Timeout: 30
                        MemorySize: 256
                        Environment:
                                Variables:
                                        ROOMS_TABLE: claudiu-rooms
                                        CONNECTIONS_TABLE: claudiu-connections
                                        WEBSOCKET_ENDPOINT: https://4iowcae701.execute-api.eu-central-1.amazonaws.com/prod
                        Code:
                                ZipFile: |
                                        def handler(event, context):
                                            return {'statusCode': 200, 'body': 'ok'}

        RoomsLambdaPermission:
                Type: AWS::Lambda::Permission
                Properties:
                        FunctionName: !GetAtt RoomsLambda.Arn
                        Action: lambda:InvokeFunction
                        Principal: apigateway.amazonaws.com
                        SourceArn: !Sub arn:aws:execute-api:eu-central-1:${AWS::AccountId}:1jmrjvnbs5/*

        # ─────────────────────────────────────────
        # WebSocket Connect Lambda
        # ─────────────────────────────────────────

        WsConnectLambda:
                Type: AWS::Lambda::Function
                Properties:
                        FunctionName: claudiu-ws-connect
                        Runtime: python3.14
                        Handler: handler.handler
                        Role: !GetAtt RoomsLambdaRole.Arn
                        Timeout: 30
                        MemorySize: 256
                        Environment:
                                Variables:
                                        ROOMS_TABLE: claudiu-rooms
                                        CONNECTIONS_TABLE: claudiu-connections
                                        WEBSOCKET_ENDPOINT: https://4iowcae701.execute-api.eu-central-1.amazonaws.com/prod
                        Code:
                                ZipFile: |
                                        def handler(event, context):
                                            return {'statusCode': 200, 'body': 'ok'}

        WsConnectLambdaPermission:
                Type: AWS::Lambda::Permission
                Properties:
                        FunctionName: !GetAtt WsConnectLambda.Arn
                        Action: lambda:InvokeFunction
                        Principal: apigateway.amazonaws.com
                        SourceArn: !Sub arn:aws:execute-api:eu-central-1:${AWS::AccountId}:4iowcae701/*

        # ─────────────────────────────────────────
        # WebSocket Disconnect Lambda
        # ─────────────────────────────────────────

        WsDisconnectLambda:
                Type: AWS::Lambda::Function
                Properties:
                        FunctionName: claudiu-ws-disconnect
                        Runtime: python3.14
                        Handler: handler.handler
                        Role: !GetAtt RoomsLambdaRole.Arn
                        Timeout: 30
                        MemorySize: 256
                        Environment:
                                Variables:
                                        CONNECTIONS_TABLE: claudiu-connections
                        Code:
                                ZipFile: |
                                        def handler(event, context):
                                            return {'statusCode': 200, 'body': 'ok'}

        WsDisconnectLambdaPermission:
                Type: AWS::Lambda::Permission
                Properties:
                        FunctionName: !GetAtt WsDisconnectLambda.Arn
                        Action: lambda:InvokeFunction
                        Principal: apigateway.amazonaws.com
                        SourceArn: !Sub arn:aws:execute-api:eu-central-1:${AWS::AccountId}:4iowcae701/*

Outputs:
        RoomsLambdaArn:
                Value: !GetAtt RoomsLambda.Arn
                Export:
                        Name: claudiu-rooms-lambda-arn

        WsConnectLambdaArn:
                Value: !GetAtt WsConnectLambda.Arn
                Export:
                        Name: claudiu-ws-connect-lambda-arn

        WsDisconnectLambdaArn:
                Value: !GetAtt WsDisconnectLambda.Arn
                Export:
                        Name: claudiu-ws-disconnect-lambda-arn

        RoomsLambdaRoleArn:
                Value: !GetAtt RoomsLambdaRole.Arn
                Export:
                        Name: claudiu-rooms-lambda-role-arn
