AWSTemplateFormatVersion: "2010-09-09"
Description: Claudiu Lambda Functions - Rooms Feature

Resources:
        # 
        # IAM Role shared by all rooms-feature Lambdas
        # 

        RoomsLambdaRole:
                Type: AWS::IAM::Role
                Properties:
                        RoleName: claudiu-rooms-lambda-role
                        AssumeRolePolicyDocument:
                                Version: "2012-10-17"
                                Statement:
                                        - Effect: Allow
                                          Principal:
                                                  Service: lambda.amazonaws.com
                                          Action: sts:AssumeRole
                        ManagedPolicyArns:
                                - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
                        Policies:
                                - PolicyName: claudiu-rooms-lambda-policy
                                  PolicyDocument:
                                          Version: "2012-10-17"
                                          Statement:
                                                  - Sid: MatchesRead
                                                    Effect: Allow
                                                    Action:
                                                            - dynamodb:GetItem
                                                    Resource:
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-matches
                                                  - Sid: RoomsTableAccess
                                                    Effect: Allow
                                                    Action:
                                                            - dynamodb:PutItem
                                                            - dynamodb:GetItem
                                                            - dynamodb:UpdateItem
                                                            - dynamodb:DeleteItem
                                                            - dynamodb:Query
                                                            - dynamodb:Scan
                                                    Resource:
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-rooms
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-rooms/index/*
                                                  - Sid: WsConnectionsRead
                                                    Effect: Allow
                                                    Action:
                                                            - dynamodb:Query
                                                            - dynamodb:DeleteItem
                                                    Resource:
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-ws-connections
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-ws-connections/index/*
                                                  - Sid: WsManageConnections
                                                    Effect: Allow
                                                    Action:
                                                            - execute-api:ManageConnections
                                                    Resource:
                                                            - !Sub arn:aws:execute-api:eu-central-1:${AWS::AccountId}:*/@connections/*
                                                  - Sid: PlayerLookupRead
                                                    Effect: Allow
                                                    Action:
                                                            - dynamodb:Query
                                                            - dynamodb:BatchGetItem
                                                    Resource:
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-player-lookup
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-player-lookup/index/*
                                                  - Sid: ReplayEmitterInvoke
                                                    Effect: Allow
                                                    Action:
                                                            - lambda:InvokeFunction
                                                    Resource:
                                                            - !Sub arn:aws:lambda:eu-central-1:${AWS::AccountId}:function:claudiu-replay-emitter

        # 
        # Rooms Lambda
        # 

        RoomsLambda:
                Type: AWS::Lambda::Function
                Properties:
                        FunctionName: claudiu-rooms
                        Runtime: python3.14
                        Handler: handler.handler
                        Role: !GetAtt RoomsLambdaRole.Arn
                        Timeout: 30
                        MemorySize: 256
                        Environment:
                                Variables:
                                        ROOMS_TABLE: claudiu-rooms
                                        MATCHES_TABLE: claudiu-matches
                                        CONNECTIONS_TABLE: claudiu-ws-connections
                                        WEBSOCKET_ENDPOINT: !ImportValue claudiu-ws-endpoint
                                        PLAYER_LOOKUP_TABLE: claudiu-player-lookup
                                        REPLAY_EMITTER_FUNCTION: claudiu-replay-emitter
                        Code:
                                ZipFile: |
                                        def handler(event, context):
                                            return {'statusCode': 200, 'body': 'ok'}

Outputs:
        RoomsLambdaArn:
                Value: !GetAtt RoomsLambda.Arn
                Export:
                        Name: claudiu-rooms-lambda-arn

        RoomsLambdaRoleArn:
                Value: !GetAtt RoomsLambdaRole.Arn
                Export:
                        Name: claudiu-rooms-lambda-role-arn
