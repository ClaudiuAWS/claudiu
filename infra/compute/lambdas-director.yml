AWSTemplateFormatVersion: "2010-09-09"
Description: Claudiu Lambda Functions - AI Match Director (Bedrock)

Resources:
        #
        # IAM role for the AI Match Director Lambda
        #

        DirectorLambdaRole:
                Type: AWS::IAM::Role
                Properties:
                        RoleName: claudiu-director-lambda-role
                        AssumeRolePolicyDocument:
                                Version: "2012-10-17"
                                Statement:
                                        - Effect: Allow
                                          Principal:
                                                  Service: lambda.amazonaws.com
                                          Action: sts:AssumeRole
                        ManagedPolicyArns:
                                - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
                        Policies:
                                - PolicyName: claudiu-director-lambda-policy
                                  PolicyDocument:
                                          Version: "2012-10-17"
                                          Statement:
                                                  - Sid: BedrockInvoke
                                                    Effect: Allow
                                                    Action:
                                                            - bedrock:InvokeModel
                                                    # Direct foundation-model invocation in eu-central-1 only.
                                                    # Avoids the cross-region inference profile (eu.anthropic.*)
                                                    # which routes to regions blocked by the org SCP.
                                                    Resource:
                                                            - !Sub arn:aws:bedrock:eu-central-1::foundation-model/anthropic.*
                                                  - Sid: WsManageConnections
                                                    Effect: Allow
                                                    Action:
                                                            - execute-api:ManageConnections
                                                    Resource: !Sub arn:aws:execute-api:eu-central-1:${AWS::AccountId}:*/@connections/*
                                                  - Sid: ConnectionsTableRead
                                                    Effect: Allow
                                                    Action:
                                                            - dynamodb:Query
                                                    Resource:
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-ws-connections
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-ws-connections/index/channel-index
                                                  - Sid: RoomsTableAccess
                                                    Effect: Allow
                                                    Action:
                                                            - dynamodb:GetItem
                                                            - dynamodb:UpdateItem
                                                    Resource: !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-rooms

        #
        # Director Lambda
        #

        DirectorLambda:
                Type: AWS::Lambda::Function
                Properties:
                        FunctionName: claudiu-director-handler
                        Runtime: python3.14
                        Handler: handler.handler
                        Role: !GetAtt DirectorLambdaRole.Arn
                        Timeout: 15
                        MemorySize: 256
                        Environment:
                                Variables:
                                        ROOMS_TABLE: claudiu-rooms
                                        CONNECTIONS_TABLE: claudiu-ws-connections
                                        WEBSOCKET_ENDPOINT: !ImportValue claudiu-ws-endpoint
                                        BEDROCK_MODEL_ID: anthropic.claude-3-haiku-20240307-v1:0
                                        BEDROCK_REGION: eu-central-1
                        Code:
                                ZipFile: |
                                        def handler(event, context):
                                            return {'statusCode': 200, 'body': 'ok'}

        DirectorLambdaApiGwInvoke:
                Type: AWS::Lambda::Permission
                Properties:
                        FunctionName: !Ref DirectorLambda
                        Action: lambda:InvokeFunction
                        Principal: apigateway.amazonaws.com
                        SourceArn: !Sub arn:aws:execute-api:eu-central-1:${AWS::AccountId}:*/*/POST/rooms/*/director-tick

Outputs:
        DirectorLambdaArn:
                Value: !GetAtt DirectorLambda.Arn
                Export:
                        Name: claudiu-director-lambda-arn
