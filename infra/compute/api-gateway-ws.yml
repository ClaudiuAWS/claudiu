AWSTemplateFormatVersion: "2010-09-09"
Description: Claudiu API Gateway - WebSocket

Resources:
        # ─────────────────────────────────────────
        # WebSocket API
        # ─────────────────────────────────────────

        WebSocketApi:
                Type: AWS::ApiGatewayV2::Api
                Properties:
                        Name: claudiu-ws-api
                        ProtocolType: WEBSOCKET
                        RouteSelectionExpression: "$request.body.action"

        WsHandlerRole:
                Type: AWS::IAM::Role
                Properties:
                        RoleName: claudiu-ws-handler-role
                        AssumeRolePolicyDocument:
                                Version: "2012-10-17"
                                Statement:
                                        - Effect: Allow
                                          Principal:
                                                  Service: lambda.amazonaws.com
                                          Action: sts:AssumeRole
                        ManagedPolicyArns:
                                - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
                        Policies:
                                - PolicyName: claudiu-ws-handler-policy
                                  PolicyDocument:
                                          Version: "2012-10-17"
                                          Statement:
                                                  - Sid: ConnectionsTableAccess
                                                    Effect: Allow
                                                    Action:
                                                            - dynamodb:PutItem
                                                            - dynamodb:DeleteItem
                                                    Resource:
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-ws-connections

        WsHandlerLambda:
                Type: AWS::Lambda::Function
                Properties:
                        FunctionName: claudiu-ws-handler
                        Runtime: python3.14
                        Handler: handler.handler
                        Role: !GetAtt WsHandlerRole.Arn
                        Timeout: 10
                        MemorySize: 128
                        Environment:
                                Variables:
                                        CONNECTIONS_TABLE: claudiu-ws-connections
                        Code:
                                ZipFile: |
                                        def handler(event, context):
                                            return {'statusCode': 200}

        WsHandlerPermission:
                Type: AWS::Lambda::Permission
                Properties:
                        FunctionName: !GetAtt WsHandlerLambda.Arn
                        Action: lambda:InvokeFunction
                        Principal: apigateway.amazonaws.com
                        SourceArn: !Sub arn:aws:execute-api:eu-central-1:${AWS::AccountId}:${WebSocketApi}/*

        # ─────────────────────────────────────────
        # Routes: $connect, $disconnect, $default
        # ─────────────────────────────────────────

        WsIntegration:
                Type: AWS::ApiGatewayV2::Integration
                Properties:
                        ApiId: !Ref WebSocketApi
                        IntegrationType: AWS_PROXY
                        IntegrationUri: !Sub arn:aws:apigateway:eu-central-1:lambda:path/2015-03-31/functions/${WsHandlerLambda.Arn}/invocations

        ConnectRoute:
                Type: AWS::ApiGatewayV2::Route
                Properties:
                        ApiId: !Ref WebSocketApi
                        RouteKey: $connect
                        AuthorizationType: NONE
                        Target: !Sub integrations/${WsIntegration}

        DisconnectRoute:
                Type: AWS::ApiGatewayV2::Route
                Properties:
                        ApiId: !Ref WebSocketApi
                        RouteKey: $disconnect
                        AuthorizationType: NONE
                        Target: !Sub integrations/${WsIntegration}

        DefaultRoute:
                Type: AWS::ApiGatewayV2::Route
                Properties:
                        ApiId: !Ref WebSocketApi
                        RouteKey: $default
                        AuthorizationType: NONE
                        Target: !Sub integrations/${WsIntegration}

        # ─────────────────────────────────────────
        # Deployment
        # ─────────────────────────────────────────

        WebSocketDeployment:
                Type: AWS::ApiGatewayV2::Deployment
                DependsOn:
                        - ConnectRoute
                        - DisconnectRoute
                        - DefaultRoute
                Properties:
                        ApiId: !Ref WebSocketApi

        WebSocketStage:
                Type: AWS::ApiGatewayV2::Stage
                Properties:
                        ApiId: !Ref WebSocketApi
                        DeploymentId: !Ref WebSocketDeployment
                        StageName: prod

Outputs:
        WebSocketApiId:
                Value: !Ref WebSocketApi
                Export:
                        Name: claudiu-ws-api-id

        WebSocketUrl:
                Value: !Sub wss://${WebSocketApi}.execute-api.eu-central-1.amazonaws.com/prod
                Export:
                        Name: claudiu-ws-url

        WebSocketEndpoint:
                Value: !Sub https://${WebSocketApi}.execute-api.eu-central-1.amazonaws.com/prod
                Export:
                        Name: claudiu-ws-endpoint
