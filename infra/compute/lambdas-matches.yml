AWSTemplateFormatVersion: "2010-09-09"
Description: Claudiu Lambda Functions - Matches Feature

Resources:
        # 
        # EventBridge role to invoke event-processor
        # 

        EventBridgeInvokeRole:
                Type: AWS::IAM::Role
                Properties:
                        RoleName: claudiu-eventbridge-invoke-role
                        AssumeRolePolicyDocument:
                                Version: "2012-10-17"
                                Statement:
                                        - Effect: Allow
                                          Principal:
                                                  Service: scheduler.amazonaws.com
                                          Action: sts:AssumeRole
                        Policies:
                                - PolicyName: claudiu-eventbridge-invoke-policy
                                  PolicyDocument:
                                          Version: "2012-10-17"
                                          Statement:
                                                  - Sid: InvokeEventProcessor
                                                    Effect: Allow
                                                    Action: lambda:InvokeFunction
                                                    Resource: !Sub arn:aws:lambda:eu-central-1:${AWS::AccountId}:function:claudiu-event-processor

        # 
        # Replay Emitter Role
        # 

        ReplayEmitterRole:
                Type: AWS::IAM::Role
                Properties:
                        RoleName: claudiu-replay-emitter-role
                        AssumeRolePolicyDocument:
                                Version: "2012-10-17"
                                Statement:
                                        - Effect: Allow
                                          Principal:
                                                  Service: lambda.amazonaws.com
                                          Action: sts:AssumeRole
                        ManagedPolicyArns:
                                - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
                        Policies:
                                - PolicyName: claudiu-replay-emitter-policy
                                  PolicyDocument:
                                          Version: "2012-10-17"
                                          Statement:
                                                  - Sid: MatchEventsRead
                                                    Effect: Allow
                                                    Action:
                                                            - dynamodb:Query
                                                    Resource:
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-match-events
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-match-events/index/*
                                                  - Sid: MatchesWrite
                                                    Effect: Allow
                                                    Action:
                                                            - dynamodb:GetItem
                                                            - dynamodb:UpdateItem
                                                    Resource:
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-matches
                                                  - Sid: SchedulerCreate
                                                    Effect: Allow
                                                    Action:
                                                            - scheduler:CreateSchedule
                                                    Resource: "*"
                                                  - Sid: PassEventBridgeRole
                                                    Effect: Allow
                                                    Action:
                                                            - iam:PassRole
                                                    Resource: !GetAtt EventBridgeInvokeRole.Arn
                                                  - Sid: InvokeEventProcessorForWarmup
                                                    Effect: Allow
                                                    Action:
                                                            - lambda:InvokeFunction
                                                    Resource: !GetAtt EventProcessorLambda.Arn
                                                  - Sid: WsConnectionsRead
                                                    Effect: Allow
                                                    Action:
                                                            - dynamodb:Query
                                                            - dynamodb:DeleteItem
                                                    Resource:
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-ws-connections
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-ws-connections/index/*
                                                  - Sid: WsManageConnections
                                                    Effect: Allow
                                                    Action:
                                                            - execute-api:ManageConnections
                                                    Resource:
                                                            - !Sub arn:aws:execute-api:eu-central-1:${AWS::AccountId}:*/@connections/*

        # 
        # Event Processor Role
        # 

        EventProcessorRole:
                Type: AWS::IAM::Role
                Properties:
                        RoleName: claudiu-event-processor-role
                        AssumeRolePolicyDocument:
                                Version: "2012-10-17"
                                Statement:
                                        - Effect: Allow
                                          Principal:
                                                  Service: lambda.amazonaws.com
                                          Action: sts:AssumeRole
                        ManagedPolicyArns:
                                - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
                        Policies:
                                - PolicyName: claudiu-event-processor-policy
                                  PolicyDocument:
                                          Version: "2012-10-17"
                                          Statement:
                                                  - Sid: MatchesAccess
                                                    Effect: Allow
                                                    Action:
                                                            - dynamodb:GetItem
                                                            - dynamodb:UpdateItem
                                                    Resource:
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-matches
                                                  - Sid: MatchEventsAccess
                                                    Effect: Allow
                                                    Action:
                                                            - dynamodb:UpdateItem
                                                    Resource:
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-match-events
                                                  - Sid: WsConnectionsRead
                                                    Effect: Allow
                                                    Action:
                                                            - dynamodb:Query
                                                            - dynamodb:DeleteItem
                                                    Resource:
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-ws-connections
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-ws-connections/index/*
                                                  - Sid: WsManageConnections
                                                    Effect: Allow
                                                    Action:
                                                            - execute-api:ManageConnections
                                                    Resource:
                                                            - !Sub arn:aws:execute-api:eu-central-1:${AWS::AccountId}:*/@connections/*
                                                  - Sid: RoomsCleanup
                                                    Effect: Allow
                                                    Action:
                                                            - dynamodb:Query
                                                            - dynamodb:GetItem
                                                            - dynamodb:DeleteItem
                                                            - dynamodb:UpdateItem
                                                    Resource:
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-rooms
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-rooms/index/*
                                                  - Sid: PlayerLookupRead
                                                    Effect: Allow
                                                    Action:
                                                            - dynamodb:Query
                                                    Resource:
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-player-lookup
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-player-lookup/index/*
                                                  # Badges feature: event-processor uses backend/shared/badges.py
                                                  # to award `striker_1` (and future striker_N) when a goal scored
                                                  # by a drafted player is detected. Conditional PutItem only;
                                                  # no reads, no deletes.
                                                  - Sid: BadgesWrite
                                                    Effect: Allow
                                                    Action:
                                                            - dynamodb:PutItem
                                                    Resource:
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-badges
        MatchesLambdaRole:
                Type: AWS::IAM::Role
                Properties:
                        RoleName: claudiu-matches-lambda-role
                        AssumeRolePolicyDocument:
                                Version: "2012-10-17"
                                Statement:
                                        - Effect: Allow
                                          Principal:
                                                  Service: lambda.amazonaws.com
                                          Action: sts:AssumeRole
                        ManagedPolicyArns:
                                - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
                        Policies:
                                - PolicyName: claudiu-matches-lambda-policy
                                  PolicyDocument:
                                          Version: "2012-10-17"
                                          Statement:
                                                  - Sid: MatchesRead
                                                    Effect: Allow
                                                    Action:
                                                            - dynamodb:Scan
                                                            - dynamodb:GetItem
                                                    Resource:
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-matches
                                                  - Sid: MatchEventsRead
                                                    Effect: Allow
                                                    Action:
                                                            - dynamodb:Query
                                                    Resource:
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-match-events
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-match-events/index/*
                                                  - Sid: PlayerLookupRead
                                                    Effect: Allow
                                                    Action:
                                                            - dynamodb:Query
                                                    Resource:
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-player-lookup
                                                            - !Sub arn:aws:dynamodb:eu-central-1:${AWS::AccountId}:table/claudiu-player-lookup/index/*

        # 
        # Replay Emitter Lambda
        # 

        ReplayEmitterLambda:
                Type: AWS::Lambda::Function
                Properties:
                        FunctionName: claudiu-replay-emitter
                        Runtime: python3.14
                        Handler: handler.handler
                        Role: !GetAtt ReplayEmitterRole.Arn
                        Timeout: 300
                        MemorySize: 256
                        Environment:
                                Variables:
                                        MATCH_EVENTS_TABLE: claudiu-match-events
                                        MATCHES_TABLE: claudiu-matches
                                        EVENT_PROCESSOR_ARN: !Sub arn:aws:lambda:eu-central-1:${AWS::AccountId}:function:claudiu-event-processor
                                        EVENTBRIDGE_ROLE_ARN: !GetAtt EventBridgeInvokeRole.Arn
                                        SCHEDULE_GROUP: claudiu-match-events
                                        CONNECTIONS_TABLE: claudiu-ws-connections
                                        WEBSOCKET_ENDPOINT: !ImportValue claudiu-ws-endpoint
                        Code:
                                ZipFile: |
                                        def handler(event, context):
                                            return {'statusCode': 200, 'body': 'ok'}

        ReplayEmitterPermission:
                Type: AWS::Lambda::Permission
                Properties:
                        FunctionName: !GetAtt ReplayEmitterLambda.Arn
                        Action: lambda:InvokeFunction
                        Principal: apigateway.amazonaws.com
                        SourceArn: !Sub arn:aws:execute-api:eu-central-1:${AWS::AccountId}:1jmrjvnbs5/*

        MatchesLambda:
                Type: AWS::Lambda::Function
                Properties:
                        FunctionName: claudiu-matches
                        Runtime: python3.14
                        Handler: handler.handler
                        Role: !GetAtt MatchesLambdaRole.Arn
                        Timeout: 30
                        MemorySize: 256
                        Environment:
                                Variables:
                                        MATCHES_TABLE: claudiu-matches
                                        MATCH_EVENTS_TABLE: claudiu-match-events
                                        PLAYER_LOOKUP_TABLE: claudiu-player-lookup
                        Code:
                                ZipFile: |
                                        def handler(event, context):
                                            return {'statusCode': 200, 'body': 'ok'}

        MatchesLambdaPermission:
                Type: AWS::Lambda::Permission
                Properties:
                        FunctionName: !GetAtt MatchesLambda.Arn
                        Action: lambda:InvokeFunction
                        Principal: apigateway.amazonaws.com
                        SourceArn: !Sub arn:aws:execute-api:eu-central-1:${AWS::AccountId}:1jmrjvnbs5/*
        # 
        # Event Processor Lambda
        # 

        EventProcessorLambda:
                Type: AWS::Lambda::Function
                Properties:
                        FunctionName: claudiu-event-processor
                        Runtime: python3.14
                        Handler: handler.handler
                        Role: !GetAtt EventProcessorRole.Arn
                        Timeout: 30
                        MemorySize: 256
                        Environment:
                                Variables:
                                        MATCHES_TABLE: claudiu-matches
                                        MATCH_EVENTS_TABLE: claudiu-match-events
                                        CONNECTIONS_TABLE: claudiu-ws-connections
                                        WEBSOCKET_ENDPOINT: !ImportValue claudiu-ws-endpoint
                                        ROOMS_TABLE: claudiu-rooms
                                        PLAYER_LOOKUP_TABLE: claudiu-player-lookup
                                        BADGES_TABLE: claudiu-badges
                        Code:
                                ZipFile: |
                                        def handler(event, context):
                                            return {'statusCode': 200, 'body': 'ok'}

        EventProcessorPermission:
                Type: AWS::Lambda::Permission
                Properties:
                        FunctionName: !GetAtt EventProcessorLambda.Arn
                        Action: lambda:InvokeFunction
                        Principal: scheduler.amazonaws.com
                        SourceArn: !Sub arn:aws:scheduler:eu-central-1:${AWS::AccountId}:schedule/claudiu-match-events/*

        MatchEventsScheduleGroup:
                Type: AWS::Scheduler::ScheduleGroup
                Properties:
                        Name: claudiu-match-events

Outputs:
        ReplayEmitterArn:
                Value: !GetAtt ReplayEmitterLambda.Arn
                Export:
                        Name: claudiu-replay-emitter-arn

        EventProcessorArn:
                Value: !GetAtt EventProcessorLambda.Arn
                Export:
                        Name: claudiu-event-processor-arn

        EventBridgeInvokeRoleArn:
                Value: !GetAtt EventBridgeInvokeRole.Arn
                Export:
                        Name: claudiu-eventbridge-invoke-role-arn
        MatchesLambdaArn:
                Value: !GetAtt MatchesLambda.Arn
                Export:
                        Name: claudiu-matches-lambda-arn
