name: Deploy Matches Infra

on:
        push:
                branches: [main]
                paths:
                        - "infra/compute/lambdas-matches.yml"
                        # Also trigger when this workflow itself changes —
                        # without this, edits to the CLI-applied policies
                        # below land in main but never get re-applied to AWS
                        # until something else touches lambdas-matches.yml.
                        - ".github/workflows/deploy-matches-infra.yml"
        # Manual trigger from the GHA UI. Useful when the IAM in source
        # needs to be re-applied without editing the YAML.
        workflow_dispatch:

permissions:
        id-token: write
        contents: read

jobs:
        patch:
                runs-on: ubuntu-latest
                steps:
                        - uses: actions/checkout@v4

                        - name: Configure AWS credentials
                          uses: aws-actions/configure-aws-credentials@v4
                          with:
                                  role-to-assume: ${{ secrets.AWS_BACKEND_GITHUB_ACTIONS_ROLE_ARN }}
                                  aws-region: eu-central-1

                        # WHY THIS DOESN'T USE `cloudformation deploy`:
                        # The IAM roles + Lambdas in lambdas-matches.yml were
                        # bootstrapped manually outside any CFN stack. Running
                        # `cloudformation deploy` here fails on changeset
                        # creation with AWS::EarlyValidation::ResourceExistenceCheck
                        # because CFN wants to CREATE resources that already
                        # exist (RoleName conflicts, FunctionName conflicts).
                        # Doing a proper CFN import-then-deploy would require
                        # listing every existing resource in an import descriptor
                        # — 8+ resources, fragile, one-shot. Until that gets
                        # done, this workflow applies the IAM + env-var deltas
                        # via direct CLI calls that are SAFE on bootstrapped
                        # resources (PutRolePolicy + UpdateFunctionConfiguration
                        # are idempotent, additive, and don't conflict with
                        # existing inline policies / env vars).

                        - name: Apply event-processor inline write policy
                          run: |
                                  set -e
                                  aws iam put-role-policy \
                                    --role-name claudiu-event-processor-role \
                                    --policy-name claudiu-event-processor-writes \
                                    --policy-document '{
                                      "Version": "2012-10-17",
                                      "Statement": [
                                        {
                                          "Sid": "BadgesWrite",
                                          "Effect": "Allow",
                                          "Action": ["dynamodb:PutItem", "dynamodb:UpdateItem"],
                                          "Resource": "arn:aws:dynamodb:eu-central-1:507609143109:table/claudiu-badges"
                                        },
                                        {
                                          "Sid": "MatchHistoryWrite",
                                          "Effect": "Allow",
                                          "Action": "dynamodb:PutItem",
                                          "Resource": "arn:aws:dynamodb:eu-central-1:507609143109:table/claudiu-match-history"
                                        },
                                        {
                                          "Sid": "LeaderboardWrite",
                                          "Effect": "Allow",
                                          "Action": "dynamodb:UpdateItem",
                                          "Resource": "arn:aws:dynamodb:eu-central-1:507609143109:table/claudiu-leaderboard"
                                        },
                                        {
                                          "Sid": "CreditsWrite",
                                          "Effect": "Allow",
                                          "Action": "dynamodb:UpdateItem",
                                          "Resource": "arn:aws:dynamodb:eu-central-1:507609143109:table/claudiu-credits"
                                        }
                                      ]
                                    }'

                        # Separate policy because put-role-policy OVERWRITES the named
                        # policy each call. Keeping Bedrock in its own inline policy
                        # lets the DynamoDB writes above stay untouched if we ever
                        # tweak only one or the other.
                        #
                        # Resource is `"*"` here (not narrowed to the
                        # inference-profile + foundation-model ARN pattern the director
                        # uses) because the previous narrower version applied
                        # successfully but the Lambda still got AccessDenied — the
                        # exact ARN that `bedrock.converse(...)` checks against may
                        # not match our pattern for cross-region inference profiles.
                        # The action set is still scoped to the four Bedrock invoke
                        # APIs, so this only allows the model invocations we already
                        # wanted; it removes ARN-pattern mismatch as a variable.
                        - name: Apply event-processor bedrock invoke policy
                          run: |
                                  set -e
                                  aws iam put-role-policy \
                                    --role-name claudiu-event-processor-role \
                                    --policy-name claudiu-event-processor-bedrock \
                                    --policy-document '{
                                      "Version": "2012-10-17",
                                      "Statement": [
                                        {
                                          "Sid": "BedrockInvoke",
                                          "Effect": "Allow",
                                          "Action": [
                                            "bedrock:InvokeModel",
                                            "bedrock:InvokeModelWithResponseStream",
                                            "bedrock:Converse",
                                            "bedrock:ConverseStream"
                                          ],
                                          "Resource": "*"
                                        }
                                      ]
                                    }'

                        - name: Merge required env vars into event-processor config
                          run: |
                                  set -e
                                  CURRENT_ENV=$(aws lambda get-function-configuration \
                                    --function-name claudiu-event-processor \
                                    --query 'Environment.Variables' --output json)
                                  # Lambda configs without env vars return null — fall back to {}
                                  if [ "$CURRENT_ENV" = "null" ]; then CURRENT_ENV="{}"; fi
                                  echo "Current env vars:"
                                  echo "$CURRENT_ENV" | jq '.'
                                  # BEDROCK_MODEL_ID is set to nova-micro to match the
                                  # director Lambda which is proven to invoke this
                                  # model successfully under the BedrockInvoke policy
                                  # above. nova-lite would require explicit account-
                                  # level model access enablement; nova-micro is
                                  # already enabled because director uses it.
                                  NEW_VARS=$(echo "$CURRENT_ENV" | jq '. + {
                                    "BADGES_TABLE": "claudiu-badges",
                                    "MATCH_HISTORY_TABLE": "claudiu-match-history",
                                    "LEADERBOARD_TABLE": "claudiu-leaderboard",
                                    "CREDITS_TABLE": "claudiu-credits",
                                    "BEDROCK_MODEL_ID": "eu.amazon.nova-micro-v1:0",
                                    "BEDROCK_REGION": "eu-central-1"
                                  }')
                                  echo "New env vars:"
                                  echo "$NEW_VARS" | jq '.'
                                  echo "$NEW_VARS" | jq '{Variables: .}' > /tmp/env.json
                                  aws lambda update-function-configuration \
                                    --function-name claudiu-event-processor \
                                    --environment file:///tmp/env.json

                        - name: Verify the patches landed
                          run: |
                                  echo "=== Inline policies on event-processor role ==="
                                  aws iam list-role-policies \
                                    --role-name claudiu-event-processor-role
                                  echo ""
                                  echo "=== claudiu-event-processor-writes statements ==="
                                  aws iam get-role-policy \
                                    --role-name claudiu-event-processor-role \
                                    --policy-name claudiu-event-processor-writes \
                                    --query 'PolicyDocument.Statement[].Sid' --output json
                                  echo ""
                                  echo "=== claudiu-event-processor-bedrock statements ==="
                                  aws iam get-role-policy \
                                    --role-name claudiu-event-processor-role \
                                    --policy-name claudiu-event-processor-bedrock \
                                    --query 'PolicyDocument.Statement[].Sid' --output json
                                  echo ""
                                  echo "=== event-processor env vars (full map — grep for BEDROCK_MODEL_ID / BEDROCK_REGION / BADGES_TABLE / MATCH_HISTORY_TABLE / LEADERBOARD_TABLE / CREDITS_TABLE) ==="
                                  aws lambda get-function-configuration \
                                    --function-name claudiu-event-processor \
                                    --query 'Environment.Variables' \
                                    --output json

                        # Post-apply diagnostic dump. Prints the FULL policy
                        # document + Lambda LastModified + CodeSha256 so this
                        # workflow's log is unambiguous proof of which deploy is
                        # actually live. If a future "no diag in console" report
                        # comes in, grep this workflow run's output to verify
                        # the Lambda actually picked up the new code.
                        - name: Dump bedrock policy + Lambda code identity (diagnostic)
                          run: |
                                  echo "=== Deployed claudiu-event-processor-bedrock policy document ==="
                                  aws iam get-role-policy \
                                    --role-name claudiu-event-processor-role \
                                    --policy-name claudiu-event-processor-bedrock \
                                    --query 'PolicyDocument' --output json
                                  echo ""
                                  echo "=== Lambda code identity + env vars (LastModified is the smoking gun for stale deploys) ==="
                                  aws lambda get-function-configuration \
                                    --function-name claudiu-event-processor \
                                    --query '{LastModified: LastModified, Runtime: Runtime, CodeSha256: CodeSha256, Env: Environment.Variables}' \
                                    --output json
