name: Deploy Friends Lambda

on:
        push:
                branches: [main]
                paths:
                        - "backend/friends/**"
                        - "backend/shared/**"

permissions:
        id-token: write
        contents: read

jobs:
        deploy:
                runs-on: ubuntu-latest
                steps:
                        - uses: actions/checkout@v4

                        - name: Configure AWS credentials
                          uses: aws-actions/configure-aws-credentials@v4
                          with:
                                  role-to-assume: ${{ secrets.AWS_BACKEND_GITHUB_ACTIONS_ROLE_ARN }}
                                  aws-region: eu-central-1

                        - name: Build and deploy
                          run: |
                                  cd backend/friends
                                  cp ../shared/ws.py ../shared/credits.py .
                                  zip function.zip handler.py ws.py credits.py
                                  aws lambda update-function-code \
                                    --function-name claudiu-friends \
                                    --zip-file fileb://function.zip
