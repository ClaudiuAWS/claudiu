name: Deploy Credits Lambda

on:
        push:
                branches: [main]
                paths:
                        - "backend/credits/**"
                        - "backend/shared/credits.py"
                        - "infra/storage/dynamodb-credits.yml"
                        - "infra/compute/lambdas-credits.yml"

permissions:
        id-token: write
        contents: read

jobs:
        deploy:
                runs-on: ubuntu-latest
                steps:
                        - uses: actions/checkout@v4

                        - name: Configure AWS credentials
                          uses: aws-actions/configure-aws-credentials@v4
                          with:
                                  role-to-assume: ${{ secrets.AWS_BACKEND_GITHUB_ACTIONS_ROLE_ARN }}
                                  aws-region: eu-central-1

                        # Self-bootstrap: the credits table + Lambda CFN stacks
                        # are deployed by this same workflow so a fresh checkout
                        # doesn't need a manual `aws cloudformation deploy` from
                        # a prod-authed terminal. Stacks are idempotent — these
                        # deploys are no-ops once the resources exist. Order
                        # matters: lambdas-credits.yml imports the table ARN.
                        - name: Deploy credits DDB table
                          run: |
                                  aws cloudformation deploy \
                                    --template-file infra/storage/dynamodb-credits.yml \
                                    --stack-name claudiu-credits-table \
                                    --no-fail-on-empty-changeset \
                                    --s3-bucket claudiu-profile-pictures-507609143109 \
                                    --s3-prefix cfn-templates

                        - name: Deploy credits Lambda CFN
                          run: |
                                  aws cloudformation deploy \
                                    --template-file infra/compute/lambdas-credits.yml \
                                    --stack-name claudiu-credits-lambda \
                                    --capabilities CAPABILITY_NAMED_IAM \
                                    --no-fail-on-empty-changeset \
                                    --s3-bucket claudiu-profile-pictures-507609143109 \
                                    --s3-prefix cfn-templates

                        - name: Build and deploy code
                          run: |
                                  cd backend/credits
                                  # Bundle the shared writer module alongside the local handler.
                                  # Renamed to `credits_shared.py` to avoid the import name
                                  # colliding with the local handler module (mirrors what the
                                  # badges Lambda does).
                                  cp ../shared/credits.py ./credits_shared.py
                                  zip function.zip handler.py credits_shared.py
                                  aws lambda update-function-code \
                                    --function-name claudiu-credits \
                                    --zip-file fileb://function.zip
