name: Deploy WS Disconnect Lambda

on:
        push:
                branches: [main]
                paths:
                        - "backend/ws-disconnect/**"
                        - "backend/shared/**"

permissions:
        id-token: write
        contents: read

jobs:
        deploy:
                runs-on: ubuntu-latest
                steps:
                        - uses: actions/checkout@v4

                        - name: Configure AWS credentials
                          uses: aws-actions/configure-aws-credentials@v4
                          with:
                                  role-to-assume: ${{ secrets.AWS_BACKEND_GITHUB_ACTIONS_ROLE_ARN }}
                                  aws-region: eu-central-1

                        - name: Build and deploy
                          run: |
                                  cd backend/ws-disconnect
                                  cp ../shared/constants.py .
                                  pip install -r requirements.txt \
                                    --platform mlinux_x86_64 \
                                    --target ./package \
                                    --implementation cp \
                                    --python-version 3.14 \
                                    --only-binary=:all:
                                  cp handler.py constants.py ./package
                                  cd package && zip -r ../function.zip .
                                  aws lambda update-function-code \
                                    --function-name claudiu-ws-disconnect \
                                    --zip-file fileb://../function.zip
